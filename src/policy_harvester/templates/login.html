<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>로그인 · Policy Harvester</title><style>
:root{--ink:#1b2430;--ink-2:#455163;--muted:#5f6b7c;--faint:#8a94a3;--nav:#10283a;--brand:#0f6c8c;--brand-hover:#0b5874;--ring:rgba(15,108,140,.28);--bad:#b42318;--bad-soft:#fde8e6;--bad-line:#f5c2bc}
*{box-sizing:border-box}
body{margin:0;font:14px/1.55 "Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;color:var(--ink);
  background:radial-gradient(1200px 600px at 50% -10%,#1d4a66 0%,var(--nav) 60%) var(--nav);display:grid;place-items:center;min-height:100vh;min-height:100dvh;padding:24px 16px}
.box{background:#fff;padding:32px;border-radius:14px;width:min(400px,100%);display:grid;gap:16px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.head{display:flex;align-items:center;gap:12px;margin-bottom:4px}
.head::before{content:"PH";flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:10px;background:var(--brand);color:#fff;font-weight:700;font-size:14px}
h1{margin:0;font-size:19px;line-height:1.3}p{margin:0;color:var(--muted);font-size:13px}
label{display:grid;gap:6px;font-size:13px;font-weight:600;color:var(--ink-2)}
input,button{font:inherit;min-height:44px;padding:0 12px;border:1px solid #c3ccd6;border-radius:8px;width:100%}
input{font-weight:400;color:var(--ink);background:#fff;transition:border-color .12s,box-shadow .12s}
input:hover{border-color:#a9b4c1}
input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--ring)}
button{margin-top:4px;background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600;cursor:pointer;white-space:nowrap}
button:hover{background:var(--brand-hover);border-color:var(--brand-hover)}
button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.bad{color:var(--bad);background:var(--bad-soft);border:1px solid var(--bad-line);border-left-width:4px;border-radius:8px;padding:10px 12px;font-size:13px}
@media (max-width:420px){.box{padding:24px 20px}}
.note{color:var(--ink-2);background:#eef4f8;border:1px solid #cfe0ea;border-left-width:4px;border-radius:8px;padding:10px 12px;font-size:13px}
</style></head><body><form class="box" method="post"><div class="head"><div><h1>Policy Harvester</h1><p>인하대 장학 공고 수집·구조화 관리자</p></div></div>
{% if error %}<p class="bad" role="alert">{{ error }}</p>{% elif request.query_params.get('logged_out') %}<p class="note" role="status">로그아웃했습니다.</p>{% elif request.query_params.get('expired') %}<p class="note" role="status">로그인이 만료되었거나 다른 곳에서 비밀번호가 바뀌었습니다. 다시 로그인하세요.</p>{% endif %}
<label for="email">이메일<input id="email" type="email" name="email" value="{{ email or '' }}" autocomplete="username" required autofocus></label>
<label for="password">비밀번호<input id="password" type="password" name="password" autocomplete="current-password" required></label>
<button>로그인</button></form></body></html>
